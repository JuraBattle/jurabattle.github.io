<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5B3FE0">
<title>JuraBattle – Jura-Quiz & Partyspiele</title>
<meta name="description" content="JuraBattle: Jura-Quiz mit Duellen gegen Freunde, Solo-Modus und Partyspielen.">
<style>
:root{
  --violett:#5B3FE0;
  --tief:#2B1A8F;
  --pink:#E0489C;
  --gold:#FFC857;
  --text:#ffffff;
  --knopf-text:#1b1340;
}
*{box-sizing:border-box}
html{background:var(--tief)}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:40px 20px 24px;color:var(--text);text-align:center;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(60% 40% at 15% 10%, rgba(224,72,156,.55) 0%, rgba(224,72,156,0) 70%),
    radial-gradient(55% 40% at 90% 30%, rgba(255,200,87,.28) 0%, rgba(255,200,87,0) 70%),
    linear-gradient(160deg, var(--violett) 0%, #7B3FE0 45%, var(--pink) 100%);
  background-attachment:fixed;
  position:relative;overflow-x:hidden;
}
/* dezente schwebende Paragrafzeichen */
body::before,body::after{
  content:"§";position:fixed;font-weight:800;color:#fff;opacity:.08;pointer-events:none;
}
body::before{font-size:200px;top:-30px;right:-20px;transform:rotate(12deg)}
body::after{font-size:260px;bottom:-60px;left:-30px;transform:rotate(-10deg)}
main{width:100%;max-width:420px;position:relative;z-index:1}
.logo{
  width:96px;height:96px;margin:0 auto 18px;border-radius:26px;
  display:flex;align-items:center;justify-content:center;font-size:3rem;
  background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 12px 30px rgba(20,8,70,.35), inset 0 1px 0 rgba(255,255,255,.4);
  backdrop-filter:blur(6px);
}
h1{font-size:2.3rem;margin:0 0 8px;letter-spacing:-.5px;text-shadow:0 2px 14px rgba(20,8,70,.35)}
.untertitel{
  display:inline-block;margin:0 0 14px;padding:5px 14px;border-radius:999px;font-size:.85rem;font-weight:700;
  color:#3b2a00;background:linear-gradient(90deg,#FFE08A,var(--gold));
  box-shadow:0 4px 14px rgba(255,200,87,.35);
}
p{margin:0 0 28px;line-height:1.5;font-size:1.05rem;color:rgba(255,255,255,.92)}
a.knopf{
  display:flex;align-items:center;gap:14px;margin:14px 0;padding:14px 18px;border-radius:18px;
  background:#fff;color:var(--knopf-text);text-decoration:none;text-align:left;
  box-shadow:0 10px 26px rgba(20,8,70,.35);
  border:2px solid transparent;
  transition:transform .15s ease, box-shadow .15s ease;
}
a.knopf:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(20,8,70,.42)}
a.knopf:active{transform:scale(.98)}
a.knopf:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.symbol{
  flex:0 0 auto;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--violett),var(--pink));
  box-shadow:0 6px 14px rgba(91,63,224,.4);
}
.symbol svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.text{display:flex;flex-direction:column;line-height:1.15}
.text small{font-size:.78rem;font-weight:600;color:#6b5fa8;text-transform:uppercase;letter-spacing:.6px}
.text strong{font-size:1.3rem;font-weight:800}
.pfeil{margin-left:auto;font-size:1.5rem;color:var(--violett);font-weight:700}
footer{position:relative;z-index:1;font-size:.9rem;padding-top:36px;color:rgba(255,255,255,.85)}
footer a{color:#fff;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">⚖️</div>
  <h1>JuraBattle</h1>
  <span class="untertitel">Quiz-Battle · Solo · Partyspiele</span>
  <p>Das Jura-Quiz mit Duellen gegen Freunde, Solo-Modus und Partyspielen.</p>

  <a class="knopf" href="https://apps.apple.com/de/app/jurabattle/id6835044223">
    <span class="symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg></span>
    <span class="text"><small>Herunterladen im</small><strong>App Store</strong></span>
    <span class="pfeil" aria-hidden="true">›</span>
  </a>

  <!-- Android-Knopf: erst einfügen, wenn die App bei Google Play live ist -->
  <a class="knopf" href="https://play.google.com/store/apps/details?id=de.jurabattle.app">
    <span class="symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg></span>
    <span class="text"><small>Herunterladen bei</small><strong>Google Play</strong></span>
    <span class="pfeil" aria-hidden="true">›</span>
  </a>
</main>
<footer>
  <a href="https://jurabattle.github.io/jurabattle/impressum.html">Impressum</a> ·
  <a href="https://jurabattle.github.io/jurabattle/datenschutz.html">Datenschutz</a>
</footer>
</body>
</html>
